name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unix:
    # Linux/macOS: Boost headers come from apt/brew in seconds.
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      apt-packages: libboost-dev
      brew-packages: boost
      tsan: true

  windows:
    # Windows: Boost via vcpkg manifest (vcpkg.json), binaries cached between runs.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
    steps:
      - uses: actions/checkout@v7

      - name: Create binary cache dir
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 40dd49b0c9c7dbd79dc64cad5e82308eae04f67f

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
