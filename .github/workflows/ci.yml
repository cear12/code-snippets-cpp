name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unix:
    # Linux/macOS: Boost headers come from apt/brew in seconds.
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      apt-packages: libboost-dev
      brew-packages: boost
      tsan: true

  windows:
    # Windows: Boost via the vcpkg that ships with the runner image (manifest mode,
    # driven by vcpkg.json). lukka/run-vcpkg is not used: it tried to git-checkout a
    # vcpkg directory inside the repo and failed with "pathspec ... did not match".
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
    steps:
      - uses: actions/checkout@v7

      - name: Create binary cache dir
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: |
          toolchain="${VCPKG_INSTALLATION_ROOT//\\//}/scripts/buildsystems/vcpkg.cmake"
          echo "using $toolchain"
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$toolchain"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
